name: write_file
on:
  workflow_dispatch:
    inputs:
      path:
        description: "path in repo"
        required: true
        type: string
      content_b64:
        description: "file content as base64"
        required: true
        type: string
      message:
        description: "commit message"
        required: true
        type: string

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - name: write file via API
        uses: actions/github-script@v7
        env:
          INPUT_PATH: ${{ inputs.path }}
          INPUT_CONTENT_B64: ${{ inputs.content_b64 }}
          INPUT_MESSAGE: ${{ inputs.message }}
        with:
          script: |
            const content_b64 = process.env.INPUT_CONTENT_B64;
            const path = process.env.INPUT_PATH;
            const message = process.env.INPUT_MESSAGE;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let sha;
            try {
              const r = await github.rest.repos.getContent({ owner, repo, path });
              sha = r.data.sha;
              core.info(`existing sha=${sha}`);
            } catch (e) {
              if (e.status !== 404) throw e;
              core.info('new file');
            }
            const params = {
              owner, repo, path,
              message,
              content: Buffer.from(content_b64, 'base64').toString('base64'),
              branch: 'main',
            };
            if (sha) params.sha = sha;
            const res = await github.rest.repos.createOrUpdateFileContents(params);
            core.info(`commit=${res.data.commit.sha}`);
            core.info(`size=${res.data.content.size}`);