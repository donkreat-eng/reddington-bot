name: Cron Watchdog

# Watchdog for GitHub Actions scheduled workflow delays/drops.
# Runs every 5 minutes. ALWAYS dispatches bot.yml — auto-detection inside bot.yml
# picks the right job for the current UTC time (morning_brief/market_overview/
# tiger_day/asian_review/alert_monitor). This way, even if bot.yml's own
# `schedule:` cron gets stuck or delayed, the watchdog keeps firing every cycle.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch bot.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "watchdog tick at $(date -u +%FT%TZ)"
          # Unconditional dispatch — bot.yml auto-detects the right job from UTC time.
          HTTP=$(curl -s -o /tmp/dispatch.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/bot.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "dispatch HTTP: ${HTTP}"
          cat /tmp/dispatch.json || true
          echo "watchdog done"