name: Append base64 chunk (ref-based, no main history pollution)

on:
  workflow_dispatch:
    inputs:
      path:
        description: 'File path in repo'
        required: true
        type: string
      chunk_index:
        description: '1-based chunk index'
        required: true
        type: string
      total_chunks:
        description: 'Total chunks'
        required: true
        type: string
      chunk_b64:
        description: 'Base64 chunk content'
        required: true
        type: string
      final_sha:
        description: 'Current blob SHA (only for chunk_index=1, for updates)'
        required: false
        type: string
        default: ''
      message:
        description: 'Final commit message'
        required: true
        type: string