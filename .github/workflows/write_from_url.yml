name: write_from_url
on:
  push:
    paths: ['jobs/_mo_chunks/**']
permissions:
  contents: write
jobs:
  push-concat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');const p=require('path');
            const d='jobs/_mo_chunks';
            if(!fs.existsSync(d)){core.info('no chunks dir');return;}
            const files=fs.readdirSync(d).filter(f=>f.startsWith('chunk_')&&f.endsWith('.txt')).sort();
            if(!files.length){core.info('no chunks');return;}
            if(!fs.existsSync(d+'/DONE')){core.info('not done yet');return;}
            let s='';for(const f of files)s+=fs.readFileSync(p.join(d,f),'utf-8');
            const owner=context.repo.owner,repo=context.repo.repo,path='jobs/market_overview.py';
            let sha;try{const r=await github.rest.repos.getContent({owner,repo,path});sha=r.data.sha}catch(e){if(e.status!==404)throw e}
            const params={owner,repo,path,message:'Concat chunks to jobs/market_overview.py',content:Buffer.from(s).toString('base64'),branch:'main'};
            if(sha)params.sha=sha;
            const res=await github.rest.repos.createOrUpdateFileContents(params);
            core.info(`commit=${res.data.commit.sha} size=${res.data.content.size}`);