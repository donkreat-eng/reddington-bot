name: write_from_url
on:
  workflow_dispatch:
    inputs:
      path:
        description: "path in repo"
        required: true
        type: string
      source_url:
        description: "URL to fetch content from"
        required: true
        type: string
      message:
        description: "commit message"
        required: true
        type: string
permissions:
  contents: write
jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - name: write file via API
        uses: actions/github-script@v7
        with:
          script: |
            const url = process.env.INPUT_SOURCE_URL;
            const path = process.env.INPUT_PATH;
            const message = process.env.INPUT_MESSAGE;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const resp = await fetch(url);
            if (!resp.ok) throw new Error(`fetch ${url}: ${resp.status}`);
            const buf = Buffer.from(await resp.arrayBuffer());
            const content = buf.toString('base64');
            core.info(`fetched size=${buf.length}`);
            let sha;
            try {
              const r = await github.rest.repos.getContent({ owner, repo, path });
              sha = r.data.sha;
              core.info(`existing sha=${sha}`);
            } catch (e) {
              if (e.status !== 404) throw e;
              core.info('new file');
            }
            const params = { owner, repo, path, message, content, branch: 'main' };
            if (sha) params.sha = sha;
            const res = await github.rest.repos.createOrUpdateFileContents(params);
            core.info(`commit=${res.data.commit.sha}`);
            core.info(`size=${res.data.content.size}`);