name: Reddington Bot

on:
  schedule:
    # UTC -> Yekaterinburg (UTC+5)
    - cron: '0 4 * * 1-5'   # 04:00 UTC = 09:00 YEKT Mon-Fri -> morning_brief
    - cron: '30 8 * * 1-5'  # 08:30 UTC = 13:30 YEKT Mon-Fri -> market_overview
    - cron: '45 9 * * 1-5'  # 09:45 UTC = 14:45 YEKT Mon-Fri -> tiger_day
    - cron: '15 11 * * 1-5' # 11:15 UTC = 16:15 YEKT Mon-Fri -> asian_review
    - cron: '0 15 * * 0'    # 15:00 UTC = 20:00 YEKT Sun -> weekly_preview
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run (or empty for auto-detect by UTC time)'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - morning_brief
          - market_overview
          - tiger_day
          - asian_review
          - weekly_preview

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REDDINGTON_BOT_TOKEN: ${{ secrets.REDDINGTON_BOT_TOKEN }}
      REDDINGTON_CHANNEL_ID: ${{ secrets.REDDINGTON_CHANNEL_ID }}
      REDDINGTON_CHANNEL_NAME: 'Reddington Trade'
    steps:
      - name: Set up job
        run: echo "post job starting"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests matplotlib numpy pillow

      - name: Setup env
        run: |
          echo "REDDINGTON_BOT_TOKEN=${{ secrets.REDDINGTON_BOT_TOKEN }}" >> $GITHUB_ENV
          echo "REDDINGTON_CHANNEL_ID=${{ secrets.REDDINGTON_CHANNEL_ID }}" >> $GITHUB_ENV
          echo "REDDINGTON_CHANNEL_NAME=Reddington Trade" >> $GITHUB_ENV

      - name: Run job
        env:
          JOB: ${{ inputs.job || 'auto' }}
        run: |
          # Determine which job to run based on time (or manual override)
          INPUT_JOB="${{ inputs.job }}"
          if [ -n "$INPUT_JOB" ]; then
            JOB="$INPUT_JOB"
          else
            HOUR=$(date -u +%H)
            MIN=$(date -u +%M)
            WD=$(date -u +%u)  # 1=Mon..7=Sun
            echo "UTC time: ${HOUR}:${MIN}, weekday: ${WD}"

            JOB="none"
            if [ "$WD" -ge 1 ] && [ "$WD" -le 5 ]; then
              if [ "$HOUR" = "04" ] && [ "$MIN" -ge "0" ] && [ "$MIN" -lt "60" ]; then
                JOB="morning_brief"
              elif [ "$HOUR" = "08" ] && [ "$MIN" -ge "30" ] && [ "$MIN" -lt "60" ]; then
                JOB="market_overview"
              elif [ "$HOUR" = "09" ] && [ "$MIN" -ge "45" ] && [ "$MIN" -lt "60" ]; then
                JOB="tiger_day"
              elif [ "$HOUR" = "11" ] && [ "$MIN" -ge "15" ] && [ "$MIN" -lt "60" ]; then
                JOB="asian_review"
              fi
            elif [ "$WD" = "7" ]; then
              if [ "$HOUR" = "15" ] && [ "$MIN" -ge "0" ] && [ "$MIN" -lt "60" ]; then
                JOB="weekly_preview"
              fi
            fi
          fi

          echo "running job: ${JOB}"
          mkdir -p posts logs
          set -euo pipefail
          export PYTHONPATH="${GITHUB_WORKSPACE:-.}"
          if [ "$JOB" = "none" ]; then
            echo "no scheduled job for this UTC time — skipping"
            exit 0
          fi
          python jobs/${JOB}.py 2>&1 | tee logs/${JOB}_run.log
