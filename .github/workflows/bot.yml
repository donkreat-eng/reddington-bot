name: Reddington Bot

on:
  # Morning brief — Mon-Fri 04:00 UTC = 09:00 YEKT
  schedule:
    - cron: '0 4 * * 1-5'
    # Market overview (Top-5 + Metals) — Mon-Fri 08:30 UTC = 13:30 YEKT
    - cron: '30 8 * * 1-5'
    # Tiger day — Mon-Fri 09:45 UTC = 14:45 YEKT
    - cron: '45 9 * * 1-5'
    # Asian review — Mon-Fri 11:15 UTC = 16:15 YEKT
    - cron: '15 11 * * 1-5'
    # Weekly preview — Sunday 15:00 UTC = 20:00 YEKT
    - cron: '0 15 * * 0'
    # Alert monitor — every 10 minutes
    - cron: '*/10 * * * *'

  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run (optional, auto-detected if empty)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - morning_brief
          - market_overview
          - tiger_day
          - asian_review
          - weekly_preview
          - alert_monitor
          - fix_asian_review

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup env
        run: |
          echo "REDDINGTON_BOT_TOKEN=${{ secrets.REDDINGTON_BOT_TOKEN }}" >> $GITHUB_ENV
          echo "REDDINGTON_CHANNEL_ID=${{ secrets.REDDINGTON_CHANNEL_ID }}" >> $GITHUB_ENV
          echo "REDDINGTON_CHANNEL_NAME=Reddington Trade" >> $GITHUB_ENV

      - name: Run job
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}